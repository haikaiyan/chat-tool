name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包为单文件 exe
        run: pyinstaller --noconsole --onefile --clean --name ChatAuditTool main.py

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: ChatAuditTool-windows-exe
          path: dist/ChatAuditTool.exe
          if-no-files-found: error
